# 只在本机反向代理；apps/server 仍然只监听 127.0.0.1。
# 把 waterbot.example.com、证书路径和静态目录替换成实际值后再启用。
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name waterbot.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name waterbot.example.com;

  ssl_certificate /etc/letsencrypt/live/waterbot.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/waterbot.example.com/privkey.pem;

  root /opt/waterbot/apps/web/dist;
  index index.html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # SSE 实时更新：关闭缓冲，允许长连接。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
